[package]
name = "gustay"
version = "1.0.0"
description = "GUStay - keep the screen awake with theme support"
authors = ["GUTeam"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gustay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
